; PlatformIO Project Configuration File for Garden Gateway
; Target: ESP32-C3 Super Mini (USB Serial to ESP-NOW bridge)

[env:esp32-c3-gateway]
platform = espressif32 @ 6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I ../common
lib_deps =
    bblanchon/ArduinoJson @ 7.0.4
