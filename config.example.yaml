# ==============================================================================
# Radxa ROCK Pi S Smart Water & Precision Irrigation Controller Configuration
# Location: /etc/smart-water/config.yaml
#
# NOTE: All hardware pin fields are null by default.
# The system enters SAFE-NO-HARDWARE state until configured.
# Inspect available pins on your board using: gpioinfo
# ==============================================================================

# Head-End Hardwired IO (ROCK Pi S Header 1 via PC817 Optocoupler & Relay)
head_end:
  chip_path: null                  # e.g. "/dev/gpiochip1"
  tank_low_float_pin: null         # IN1: Float switch (Active-LOW, pull-up)
  interlock_out_pin: null          # IN2: Hardware chain output (HIGH = motor allowed)
  interlock_mid_pin: null          # IN3: Mid-point between Full and Sump floats
  leak_sensor_pin: null            # IN4: Optical/conductive leak sensor (Active-LOW)
  contactor_relay_pin: null        # Output: AC Contactor driver relay
  contactor_relay_active_high: true # true = HIGH to energize, false = LOW to energize
  relay_idle_bias_confirmed: null  # Must be 'pull_up' if active-low relay used
  contactor_feedback_pin: null     # Optional: Auxiliary contact feedback
  debounce_ms: 100                 # Hardware debounce filtering (milliseconds)
  tank_low_active_low: true        # IN1: true = LOW when float closed (PC817 open-collector)
  interlock_out_active_low: true   # IN2: true = LOW when chain energized (PC817 open-collector)
  interlock_mid_active_low: true   # IN3: true = LOW when mid-tap energized (PC817 open-collector)
  leak_active_low: true            # IN4: true = LOW when leak detected (PC817 open-collector)
  feedback_active_low: true        # Aux: true = LOW when aux contact closed (PC817 open-collector)

# Garden Gateway (USB Serial Interface to ESP32-C3 Gateway)
garden_gateway:
  serial_port: "/dev/garden-gateway" # Created by udev rule
  baud_rate: 115200
  link_loss_timeout_s: 30          # Threshold before raising LINK LOST alert
  shared_key: null                 # HMAC-SHA256 shared key (generate via: python -m app.cli gen-espnow-secrets)

# Stale Data Timeouts (Stale data = unsafe data -> lock dependent actuators)
stale_thresholds:
  head_end_s: 15                   # Maximum acceptable age for head-end float readings
  garden_s: 90                     # Maximum acceptable age for wireless garden telemetry
  soil_s: 60                       # Max age for individual soil probe reading
  reservoir_s: 20                  # Max age for reservoir float status
  heartbeat_s: 30                  # Max age for node heartbeat

# Network & Server Binding
network:
  bind_address: "127.0.0.1"        # Bind to 127.0.0.1 or Tailscale/Headscale IP
  port: 8000
  allow_all_interfaces: false      # Refuses 0.0.0.0 unless explicitly true

# Security & Authentication
security:
  auth_token_file: "/var/lib/smart-water/auth.json"
  rate_limit_per_minute: 60
  webhook_allowlist: []            # Host allowlist for rule webhooks (SSRF protection)

# Motor Safety & Auto-Mode Parameters
motor:
  auto_mode: false                 # Automatic tank replenishment
  max_runtime_s: 900               # 15 minutes max continuous runtime
  cooldown_s: 1800                 # 30 minutes cooldown after max-runtime trip
  min_off_time_s: 120              # 120s mandatory rest between pump stop and next start
  pull_in_timeout_ms: 1000         # Max milliseconds to wait for contactor pull-in
  drop_out_timeout_ms: 1000        # Max milliseconds to wait for contactor drop-out

# Optional Motor Power & Current Monitoring (PZEM-004T v3 or SCT-013 CT via ADS1115)
# SAFETY: Software current monitoring provides supplementary dry-run and locked-rotor
# protection. It NEVER replaces the physical thermal overload relay or MPCB required by code.
power_meter:
  enabled: false                   # Enable AC power & current monitoring
  sensor_type: "none"              # "none", "pzem004t", or "sct013_ads1115"
  serial_port: "/dev/pzem"         # USB-TTL serial port for PZEM-004T v3 (udev symlink)
  baud_rate: 9600                  # PZEM-004T v3 Modbus RTU baud rate
  modbus_address: 1                # PZEM-004T v3 Modbus slave address (1-247)
  i2c_bus: 7                       # I2C bus number for ADS1115 CT input (e.g. 7 on ROCK Pi S)
  i2c_address: 0x48                # ADS1115 I2C address (0x48 - 0x4B)
  ct_channel: 0                    # ADS1115 single-ended analog channel (0-3)
  ct_ratio: 30.0                   # CT current clamp rating (e.g. 30.0 for SCT-013-030 30A/1V)
  voltage_min_v: 180.0             # Minimum safe single-phase AC mains voltage
  voltage_max_v: 260.0             # Maximum safe single-phase AC mains voltage
  voltage_fault_hold_s: 3.0        # Continuous out-of-voltage window hold time before trip
  dry_run_current_pct: 65.0        # Trip if current < X% of baseline (loss of prime / dry-running)
  dry_run_timeout_s: 5.0           # Continuous dry-run hold time before contactor shut-off
  overload_current_pct: 135.0      # Trip if current > Y% of baseline (locked-rotor / overload)
  overload_timeout_s: 3.0          # Continuous overload hold time before contactor shut-off
  inrush_blanking_s: 3.0           # Seconds to ignore current limits during motor starting inrush
  learning_runs_required: 5        # Number of healthy runs (>=30s) required to establish baseline
  baseline_current_a: null         # Optional manual baseline current in Amperes (null = auto-learn)

# Plant Irrigation Zones (ESP32-C3 Wireless Node)
zones:
  zone_1:
    enabled: false
    soil_dry_threshold_pct: 35.0
    pulse_seconds: 15
    max_pulse_seconds: 60
    cooldown_hours: 6.0
    has_flow_meter: true           # Zone 1 has in-line pulse flow meter
    flow_meter_model: "YF-S201"    # Hall-effect flow sensor model
    flow_k_factor: 7.5             # K-factor in Hz per L/min (7.5 for YF-S201 = 450 pulses/L)
    min_pulses_10s: 5              # Minimum expected flow pulses in 10s
    calibration:
      dry_v: null                  # In air voltage (e.g. 2.70V). Uncalibrated = cannot auto-water
      wet_v: null                  # In water voltage (e.g. 1.20V)
      margin_v: 0.20
  zone_2:
    enabled: false
    soil_dry_threshold_pct: 35.0
    pulse_seconds: 15
    max_pulse_seconds: 60
    cooldown_hours: 6.0
    has_flow_meter: false
    min_pulses_10s: 0
    calibration:
      dry_v: null
      wet_v: null
      margin_v: 0.20
  zone_3:
    enabled: false
    soil_dry_threshold_pct: 35.0
    pulse_seconds: 15
    max_pulse_seconds: 60
    cooldown_hours: 6.0
    has_flow_meter: false
    min_pulses_10s: 0
    calibration:
      dry_v: null
      wet_v: null
      margin_v: 0.20
  zone_4:
    enabled: false
    soil_dry_threshold_pct: 35.0
    pulse_seconds: 15
    max_pulse_seconds: 60
    cooldown_hours: 6.0
    has_flow_meter: false
    min_pulses_10s: 0
    calibration:
      dry_v: null
      wet_v: null
      margin_v: 0.20

# Audio Alerting (ALSA & espeak-ng over USB Audio Interface)
audio:
  enabled: true
  alsa_device: "default"
  voice: "en-us"
  speed: 145                       # espeak-ng speech rate
  quiet_hours_start: null          # e.g. 22 (10 PM)
  quiet_hours_end: null            # e.g. 7 (7 AM)

# Telegram Bot Notifications (Optional)
telegram:
  enabled: false
  bot_token: null
  chat_id: null

# Storage & Database Persistence
database:
  path: "/var/lib/smart-water/system.db"
  retention_days: 90
  cache_size_kb: -2000             # ~2MB SQLite cache limit for 512MB RAM budget

# Kernel Watchdog Keep-Alive
watchdog:
  device_path: "/dev/watchdog"
  timeout_s: 10
  pet_interval_s: 3

# Setup Completion Marker
setup_complete: false
